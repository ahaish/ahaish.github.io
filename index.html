<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ahaish | Web ツール目次</title>
    <meta
      name="description"
      content="ブラウザだけで使える小さな Web アプリをまとめた Ahaish の目次ページです。"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>ahaish</h1>
      <p>
        気になったことを試したり、ちょっと便利な機能を作っています。<br>
        インストールなしですぐに使えます。
      </p>
    </header>

    <main class="directory" aria-label="Web アプリ一覧">
      <p class="directory-label">機能一覧</p>
      <article class="app-link">
        <div>
          <h2>ガス灯時計</h2>
          <p>
            日の出と日の入りに合わせて、ガス灯の光と背景の明るさが変わります。
          </p>
        </div>
        <a href="./gas-lamp/">開く</a>
      </article>
      <article class="app-link">
        <div>
          <h2>モニターライト</h2>
          <p>
            色温度を選び、モニターを単色のライトとして使えます。
          </p>
        </div>
        <a href="./monitor-light/">開く</a>
      </article>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
